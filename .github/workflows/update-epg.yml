name: Actualizar EPG Taquillas

on:
  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  actualizar-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar EPG de las 14 taquillas
        env:
          XUI_BASE_URL: ${{ secrets.XUI_BASE_URL }}
          XUI_USERNAME: ${{ secrets.XUI_USERNAME }}
          XUI_PASSWORD: ${{ secrets.XUI_PASSWORD }}
        run: python scripts/filter_epg.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/epg.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en el EPG."
            exit 0
          fi

          git commit -m "Actualizar EPG taquillas"
          git push
